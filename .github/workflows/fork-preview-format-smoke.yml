name: Fork preview comment layout and single-comment smoke (temporary)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fork-preview-format-smoke.yml

permissions:
  contents: read

jobs:
  format:
    if: github.repository == 'schnuartz-ai/specter-diy-web-simulator'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Use trusted Web Simulator implementation only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
        with:
          ref: main
          persist-credentials: false
      - name: Load verified test preview status (not PR source code)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
        with:
          ref: gh-pages
          path: pages
          persist-credentials: false
      - name: PATCH existing own comment in place, verify no duplicates
        env:
          SPECTER_PREVIEW_BOT_TOKEN: ${{ secrets.SPECTER_PREVIEW_BOT_TOKEN }}
          SPECTER_PREVIEW_BOT_LOGIN: ${{ vars.SPECTER_PREVIEW_BOT_LOGIN }}
        run: |
          python3 - <<'PY'
          import sys, json, os
          from pathlib import Path
          sys.path.insert(0, "web/tools")
          import report_fork_machine_user as bot
          st = json.loads(Path("pages/.preview-state/pr/10.json").read_text())
          assert st["base_repository"] == bot.TARGET
          assert st["simulator_repository"] == bot.SIMULATOR
          assert st["status"] == "success"
          login = bot.verify_machine_user(os.environ["SPECTER_PREVIEW_BOT_TOKEN"],
                                          os.environ["SPECTER_PREVIEW_BOT_LOGIN"])
          def read_owned():
              all_comments = bot.list_comments(bot.TARGET, 10, os.environ["SPECTER_PREVIEW_BOT_TOKEN"])
              return bot.managed_comments(all_comments, login)
          before = read_owned()
          if len(before) != 1:
              raise SystemExit("Expected exactly one bot-owned preview before refresh")
          original_id = before[0]["id"]
          req = {
              "request_id": st["latest_request_id"],
              "action": st["latest_action"],
              "base_repository": st["base_repository"],
              "base_sha": st["base_sha"], "base_ref": st["base_ref"],
              "pr_number": 10,
              "head_repository": st["head_repository"],
              "head_sha": st["latest_source_sha"],
              "head_ref": st["head_ref"],
              "source_updated_at": st["latest_source_updated_at"],
          }
          def run():
              return bot.report(req, Path("pages"), st["simulator_sha"],
                                st["workflow_run_id"], st["run_attempt"],
                                "success", os.environ["SPECTER_PREVIEW_BOT_TOKEN"], login)
          first = run()
          if not first["applied"] or first["removed_comments"] != 0:
              raise SystemExit("First formatting refresh failed")
          after = read_owned()
          if len(after) != 1 or after[0]["id"] != original_id:
              raise SystemExit("SECURITY FAIL: bot comment duplicated or changed its ID")
          text = after[0]["body"]
          expected = ["🧪 **Specter PR Build**", "<details>",
                      "<summary>Build provenance</summary>",
                      "🖥️ [Open browser simulator]",
                      "⬇️ [Download firmware from the same commit]",
                      "⚠️ **Experimental development build.",
                      "Use dedicated test hardware for firmware builds."]
          if not all(x in text for x in expected):
              raise SystemExit("Formatting mismatch in real GitHub comment")
          second = run()
          if not second["applied"] or second["removed_comments"] != 0:
              raise SystemExit("Idempotent refresh failed")
          twice = read_owned()
          if len(twice) != 1 or twice[0]["id"] != original_id:
              raise SystemExit("SECURITY FAIL: second report duplicated a comment")
          print("PASS: One persistent PR comment, same comment ID across two reports")
          print("PASS: Exact compact layout with collapsible provenance and warning")
          print("PASS: Second identical report performed no additional post")
          print("COMMENT_ID=" + str(original_id))
          PY
