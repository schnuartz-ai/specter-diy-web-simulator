name: Update PR auto-build mode

on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      comment_id:
        required: true
        type: string
      action:
        required: true
        type: choice
        options: [set, clear]

permissions:
  contents: read

jobs:
  update:
    if: github.repository == 'cryptoadvance/specter-diy-web-simulator' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: preview-publish-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out trusted simulator code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Update auto-build mode display
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          COMMENT_ID: ${{ inputs.comment_id }}
          AUTO_MODE_ACTION: ${{ inputs.action }}
          SPECTER_PREVIEW_BOT_TOKEN: ${{ secrets.SPECTER_PREVIEW_BOT_TOKEN }}
          SPECTER_PREVIEW_BOT_LOGIN: ${{ vars.SPECTER_PREVIEW_BOT_LOGIN }}
        run: python3 web/tools/auto_mode.py
